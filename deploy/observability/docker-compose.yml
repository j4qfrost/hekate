# LGTM observability stack (Loki, Grafana, Tempo, Mimir) for hekate.
# Self-contained — does NOT join the production self-host compose; see
# docs/adr/0005-lgtm-observability-stack.md for why.
#
# Bring up with `make obs-up`; it starts the all-in-one grafana/otel-lgtm
# image plus a small Alloy gateway that forwards collected scrape data.
# Point hekate-server at this stack with:
#   HEKATE_OTLP_ENDPOINT=localhost:4317
#   HEKATE_OTLP_INSECURE=true
#
# UIs:
#   Grafana          http://localhost:3001
#   Loki API         http://localhost:3100
#   Tempo            http://localhost:3200
#   Prom-compatible  http://localhost:9009  (Mimir)
#   OTLP/gRPC        localhost:4317
#   OTLP/HTTP        localhost:4318

name: hekate-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.8.1
    container_name: hekate-lgtm
    restart: unless-stopped
    ports:
      # Loopback-bound — snowman has a public IP; this stack is Tailnet-only.
      # Hardening: SECURITY-REPORT-2026-05-22.md finding F2.
      - "127.0.0.1:${OBSERVABILITY_GRAFANA_PORT:-3001}:3000"   # Grafana (UI). 3001 chosen to avoid collisions with other dev servers.
      - "127.0.0.1:${OBSERVABILITY_OTLP_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
      - "127.0.0.1:${OBSERVABILITY_OTLP_HTTP_PORT:-4318}:4318"   # OTLP/HTTP
      - "127.0.0.1:${OBSERVABILITY_LOKI_PORT:-3100}:3100"   # Loki
      - "127.0.0.1:${OBSERVABILITY_TEMPO_PORT:-3200}:3200"   # Tempo
      - "127.0.0.1:${OBSERVABILITY_MIMIR_PORT:-9009}:9009"   # Mimir
    volumes:
      - lgtm-data:/data
      - ./grafana/dashboards:/otel-lgtm/grafana/dashboards-extra:ro
      - ./grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Anonymous access is Viewer-only (was Admin) — SECURITY-REPORT-2026-05-22.md F2.
      # Login form stays disabled; dashboards are file-provisioned, so no admin
      # UI is needed. Residual: the built-in `admin` account is still default-
      # credentialed and reachable via Grafana's API on the Tailnet — set
      # GF_SECURITY_ADMIN_PASSWORD (a good early `sigil`-managed secret) to close it.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  lgtm-data:
