# Woodpecker CI for hekate — Go server + Next.js TS web (multi-toolchain).
when:
  - event: pull_request
  - event: push
    branch: [main, master, feat/*]
  - event: manual

clone:
  git:
    image: alpine/git
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - git init -b "${CI_COMMIT_BRANCH:-main}"
      # Split-horizon fleet: the Hetzner-local agent reaches the docker-internal
      # forgejo:3000 but not the public host (hairpin); the snowman agent is the
      # reverse. PR events expose a virtual merge SHA that isn't fetchable, so
      # fall back to the event ref. Try {internal, public} x {sha, ref}.
      - >-
        git fetch --depth=1 "http://$$FORGEJO_USER:$$FORGEJO_TOKEN@forgejo:3000/${CI_REPO}.git" "$$CI_COMMIT_SHA"
        || git fetch --depth=1 "http://$$FORGEJO_USER:$$FORGEJO_TOKEN@forgejo:3000/${CI_REPO}.git" "$$CI_COMMIT_REF"
        || git fetch --depth=1 "https://$$FORGEJO_USER:$$FORGEJO_TOKEN@git.legionofweird.dev/${CI_REPO}.git" "$$CI_COMMIT_SHA"
        || git fetch --depth=1 "https://$$FORGEJO_USER:$$FORGEJO_TOKEN@git.legionofweird.dev/${CI_REPO}.git" "$$CI_COMMIT_REF"
      - git checkout -qf FETCH_HEAD

steps:
  go-check:
    image: golang:1.22
    commands:
      - cd server && go vet ./... && go build ./...
      - cd ../cli && go vet ./... && go build ./...
  lex-validate:
    image: node:20
    commands:
      - cd web && (test -f package.json && (corepack enable && pnpm install --frozen-lockfile && pnpm typecheck) || echo "(no web/package.json)")
